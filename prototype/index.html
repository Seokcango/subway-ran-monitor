<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무선망 노선도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: 시안 C — 헤드라인 + 컨트롤 바, 좌측 노선도(실제 노선·공식 색, 굵기·크기=지표), 우측 지표별 패널 */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#18181B; --ink-2:#5B5B63; --rule:#E4E1DA; --rule-strong:#18181B; --chip:#F1EFEA;
  --ok:#2F8F5B; --warn:#C28A00; --crit:#D2453B; --major:#DD7426; --nodata:#9C998F; --accent:#2F6FDB;
  --t1:#2F6FDB; --t2:#D2453B; --t3:#C9971C; --t4:#8F8C85;
  --font-body:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-num:'Space Grotesk', 'Noto Sans KR', system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141416; --surface:#1D1D21; --ink:#EDEDEF; --ink-2:#A3A3AD; --rule:#34343A; --rule-strong:#EDEDEF; --chip:#26262B;
  --ok:#4CBB7F; --warn:#E2B53B; --crit:#F0675D; --major:#F0954A; --nodata:#6E6E78; --accent:#76A5F2;
  --t1:#76A5F2; --t2:#F0675D; --t3:#E2B53B; --t4:#8E8E98; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1D1D21; --ink:#EDEDEF; --ink-2:#A3A3AD; --rule:#34343A; --rule-strong:#EDEDEF; --chip:#26262B;
  --ok:#4CBB7F; --warn:#E2B53B; --crit:#F0675D; --major:#F0954A; --nodata:#6E6E78; --accent:#76A5F2;
  --t1:#76A5F2; --t2:#F0675D; --t3:#E2B53B; --t4:#8E8E98; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5}
[hidden]{display:none !important}
.wrap{max-width:1440px; margin:0 auto; padding-block:28px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:20px}
.num{font-family:var(--font-num); font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

header.top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:16px 24px; border-bottom:2px solid var(--rule-strong); padding-bottom:16px}
.eyebrow{font-size:13px; font-weight:700; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 10px}
h1{margin:6px 0 0; font-size:clamp(24px, 3.2vw, 36px); font-weight:900; letter-spacing:-0.02em; line-height:1.2; text-wrap:balance}
.controls{display:flex; flex-wrap:wrap; gap:12px 16px; align-items:flex-end}
.ctl{display:flex; flex-direction:column; gap:4px}
.ctl-label{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--ink-2)}
.seg{display:flex; border:2px solid var(--rule-strong); border-radius:8px; overflow:hidden}
.seg button{min-height:40px; padding:0 14px; border:0; background:var(--surface); font-size:14px; font-weight:500}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); font-weight:700}

.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border-bottom:1px solid var(--rule)}
.kpi{padding:4px 20px 16px; display:flex; flex-direction:column; gap:2px; min-width:0}
.kpi + .kpi{border-left:1px solid var(--rule)}
.kpi:first-child{padding-left:0}
.kpi .k{font-size:12px; color:var(--ink-2); font-weight:500}
.kpi .v{font-size:28px; font-weight:700; line-height:1.15}
.kpi .s{font-size:12px; color:var(--ink-2)}
.kpi .v.crit{color:var(--crit)}
@media (max-width:720px){ .kpis{grid-template-columns:repeat(2, minmax(0,1fr))} .kpi:nth-child(3){padding-left:0; border-left:0} }

.main{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start}
.mapcol{flex:999 1 620px; min-width:0; display:flex; flex-direction:column; gap:10px}
aside{flex:1 1 360px; min-width:0; display:flex; flex-direction:column; gap:28px}

.mapbar{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:flex-start}
.chips{display:flex; flex-wrap:wrap; gap:6px; flex:1 1 400px; min-width:0}
.chip{min-height:34px; padding:0 11px; border-radius:17px; border:1.5px solid var(--rule); background:var(--surface); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink); font-weight:700; background:var(--chip)}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:0 0 auto}
.zoom{display:flex; gap:4px}
.zoom button{width:36px; height:36px; border-radius:8px; border:1.5px solid var(--rule); background:var(--surface); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center}

.mapbox{position:relative; background:var(--surface); border-radius:16px; overflow:hidden; touch-action:none; border:1px solid var(--rule)}
#map{display:block; width:100%; height:auto; max-width:100%; cursor:grab; user-select:none; -webkit-user-select:none}
#map.dragging{cursor:grabbing}
#map text{font-family:var(--font-body); pointer-events:none}
.st{cursor:pointer}
.st:focus{outline:none}
.st .st-core{transform-box:fill-box; transform-origin:center; transition:transform .12s ease}
.st:hover .st-core, .st:focus-visible .st-core{transform:scale(1.6)}
.st:focus-visible .st-core{stroke:var(--accent) !important}
.seg-hit{cursor:pointer}
.pulse{transform-box:fill-box; transform-origin:center; animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1); opacity:.7} 100%{transform:scale(2.6); opacity:0}}
@media (prefers-reduced-motion: reduce){ .pulse{animation:none; opacity:.35} .st .st-core{transition:none} }

.pop{position:absolute; z-index:5; width:260px; max-width:calc(100% - 16px); background:var(--surface); color:var(--ink); border:2px solid var(--ink); border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:8px; pointer-events:auto}
.pop-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.pop-head strong{font-size:17px; font-weight:900; line-height:1.25}
.pop .lines{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
.lb{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:10px; color:#FFFFFF; font-size:11px; font-weight:700}
.pop-facts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px}
.pop-facts div{background:var(--chip); border-radius:6px; padding:5px 7px}
.pop-facts .k{font-size:10.5px; color:var(--ink-2)} .pop-facts .v{font-size:15px; font-weight:700}
.pop .al{font-size:12px; display:flex; flex-direction:column; gap:4px}
.pop-actions{display:flex; gap:6px}
.pop-actions button{flex:1; min-height:36px; border-radius:8px; border:1.5px solid var(--ink); background:var(--ink); color:var(--bg); font-size:13px; font-weight:700}
.pop-actions button.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
.x{width:30px; height:30px; flex:0 0 auto; border-radius:8px; border:1.5px solid var(--rule); background:transparent; font-size:16px; line-height:1}

.legend{display:flex; flex-wrap:wrap; gap:8px 18px; font-size:12px; color:var(--ink-2); align-items:center}
.legend .it{display:inline-flex; align-items:center; gap:6px}
.note{font-size:12px; color:var(--ink-2); margin:0}

aside h2{margin:0 0 12px; font-size:16px; font-weight:900}
.rows{display:flex; flex-direction:column; gap:4px}
.row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:8px 10px; margin:0 -10px; border-radius:8px; border:0; background:transparent; text-align:left; width:calc(100% + 20px)}
.row:hover{background:var(--chip)}
.row[aria-current="true"]{background:var(--chip); box-shadow:inset 0 0 0 1.5px var(--ink)}
.row .name{font-weight:700; display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sub{font-size:12px; color:var(--ink-2); font-weight:400}
.row .val{font-weight:700; text-align:right}
.bar{grid-column:1 / -1; height:10px; background:var(--chip); border-radius:0 3px 3px 0; position:relative}
.bar > i{display:block; height:100%; border-radius:0 3px 3px 0}
.bar .tick{position:absolute; top:-3px; bottom:-3px; width:0; border-left:1.5px dashed var(--ink-2)}
.rank{font-family:var(--font-num); font-weight:700; color:var(--ink-2); width:16px; display:inline-block}
.sev{display:inline-flex; align-items:center; justify-content:center; min-width:62px; height:22px; padding:0 8px; border-radius:11px; font-size:11px; font-weight:700; color:#FFFFFF}
.sev.Critical{background:var(--crit)} .sev.Major{background:var(--major)} .sev.Minor{background:var(--warn)}
.stack{display:flex; height:30px; border-radius:6px; overflow:hidden; gap:2px}
.stack > div{display:flex; align-items:center; padding-left:8px; color:#FFFFFF; font-size:12px; font-weight:700; min-width:0; overflow:hidden}

.detail{border:2px solid var(--rule-strong); border-radius:12px; padding:16px; background:var(--surface); display:flex; flex-direction:column; gap:12px; scroll-margin-top:16px}
.detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.detail-head h2{margin:4px 0 0; font-size:20px}
.facts{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px}
.fact{background:var(--chip); border-radius:8px; padding:8px 10px}
.fact .k{font-size:11px; color:var(--ink-2)} .fact .v{font-size:18px; font-weight:700}
.tbl{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{font-size:11px; font-weight:700; color:var(--ink-2); text-align:left; padding:6px 6px; border-bottom:1px solid var(--rule)}
td{padding:7px 6px; border-bottom:1px solid var(--rule); white-space:nowrap}
td.r, th.r{text-align:right}
.st-badge{display:inline-flex; align-items:center; gap:5px; font-weight:700}
.insight{font-size:13px; background:var(--chip); border-radius:8px; padding:10px 12px; line-height:1.5}
.insight b{color:var(--crit)}
.linkbtn{min-height:44px; border-radius:8px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); font-weight:700}
.chart text{font-family:var(--font-num)}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><span>[서비스명] 무선망 노선도</span><span id="eyebrow-sel"></span><span>2026-11-10 22:00 기준</span></div>
      <h1 id="headline">선이 굵고 붉을수록 부하가 높습니다</h1>
    </div>
    <div class="controls">
      <div class="ctl"><span class="ctl-label" id="lbl-tech">기술</span>
        <div class="seg" role="group" aria-labelledby="lbl-tech" id="ctl-tech">
          <button type="button" id="tech-5g" data-v="5G">5G</button><button type="button" id="tech-lte" data-v="LTE">LTE</button>
        </div></div>
      <div class="ctl"><span class="ctl-label" id="lbl-metric">지표</span>
        <div class="seg" role="group" aria-labelledby="lbl-metric" id="ctl-metric">
          <button type="button" id="metric-voc" data-v="voc">VOC</button><button type="button" id="metric-load" data-v="load">부하율</button><button type="button" id="metric-alarm" data-v="alarm">장비알람</button>
        </div></div>
      <div class="ctl"><span class="ctl-label" id="lbl-period">기간</span>
        <div class="seg" role="group" aria-labelledby="lbl-period" id="ctl-period">
          <button type="button" id="period-24h" data-v="24h">24시간</button><button type="button" id="period-7d" data-v="7d">7일</button><button type="button" id="period-30d" data-v="30d">30일</button>
        </div></div>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="전체 요약"></section>

  <div class="main">
    <section class="mapcol" aria-label="노선도">
      <div class="mapbar">
        <div class="chips" id="line-chips" role="group" aria-label="호선 필터"></div>
        <div class="zoom">
          <button type="button" id="zoom-in" aria-label="확대">+</button>
          <button type="button" id="zoom-out" aria-label="축소">−</button>
          <button type="button" id="zoom-reset" aria-label="전체 보기">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>
      <div class="mapbox" id="mapbox">
        <svg id="map" role="group" aria-label="서울 지하철 무선망 노선도"></svg>
        <div class="pop" id="pop" hidden role="dialog" aria-label="역 정보"></div>
      </div>
      <div class="legend" id="legend"></div>
      <p class="note">가상 데이터 · 서울 시내 구간 1–9호선과 주요 광역 노선 · 노선 순서와 색은 실제 기준, 역 좌표는 근사값(공공데이터 적재 시 교체). 역을 누르면 정보 카드가 열립니다. 드래그로 이동, Ctrl+휠 또는 버튼으로 확대하면 모든 역 이름이 보입니다.</p>
    </section>

    <aside id="aside">
      <section class="detail" id="detail" hidden aria-live="polite"></section>
      <section id="panel-a"></section>
      <section id="panel-b"></section>
    </aside>
  </div>
</div>

var HOT = {'혜화':1.15,'강남':1.0,'잠실':.95,'홍대입구':.95,'고속터미널':.9,'서울역':.9,'신도림':.88,'동대문역사문화공원':.9,'신림':.85,'구로디지털단지':.85,'삼성':.85,'건대입구':.85,'종로3가':.84,'사당':.82,'선릉':.82,'역삼':.8,'여의도':.8,'왕십리':.8,'을지로입구':.78,'시청':.74,'가산디지털단지':.78,'노원':.72,'수서':.7,'합정':.72,'공덕':.74,'명동':.7,'천호':.68,'연신내':.66,'청량리':.72,'교대':.74};
var CODE = {'혜화':'HH','동대문역사문화공원':'DDP','종로3가':'JR3','강남':'GN','왕십리':'WSR','서울역':'SEO','시청':'CHG','신림':'SLM','을지로3가':'EJ3','충무로':'CMR','을지로입구':'EJ1','동대문':'DDM'};
var VOC_TYPES = ['속도저하','끊김','접속불가','기타'];

var HEADLINE = {load:'선이 굵고 붉을수록 부하가 높습니다', voc:'원이 클수록 민원이 많습니다', alarm:'표식이 있는 곳에 미해제 알람이 있습니다'};
var PROFILE = [.35,.25,.2,.18,.2,.35,.6,.9,1,.75,.62,.6,.65,.62,.6,.66,.78,.92,.98,1,.95,.86,.7,.5];

/* ---------- 파생 구조 ---------- */
var LINE_BY_ID = {}, stationLines = {}, SEGS = [], SEG_BY_ID = {};
LINES.forEach(function(l){
  LINE_BY_ID[l.id] = l;
  l.br.forEach(function(b){
    b.forEach(function(s){
      if (!C[s]) throw new Error('좌표 없음: ' + s);
      var arr = stationLines[s] = stationLines[s] || [];
      if (arr.indexOf(l.id) < 0) arr.push(l.id);
    });
    for (var i = 0; i < b.length - 1; i++){
      var id = l.id + ':' + b[i] + '-' + b[i+1];
      if (SEG_BY_ID[id]) continue;
      var sg = {id:id, line:l.id, a:b[i], b:b[i+1], rep:'REP-T-' + String(SEGS.length + 1).padStart(3, '0')};
      SEGS.push(sg); SEG_BY_ID[id] = sg;
    }
  });
});
var STATIONS = Object.keys(stationLines);
STATIONS.forEach(function(s, i){ if (!CODE[s]) CODE[s] = 'S' + String(i + 1).padStart(3, '0'); });
// 같은 두 역을 지나는 다른 노선은 나란히 그리기
var pairCount = {}, pairIdx = {};
SEGS.forEach(function(s){ var k = [s.a, s.b].sort().join('|'); pairCount[k] = (pairCount[k] || 0) + 1; });
SEGS.forEach(function(s){ var k = [s.a, s.b].sort().join('|'); pairIdx[k] = (pairIdx[k] || 0); s.par = pairIdx[k] - (pairCount[k] - 1) / 2; pairIdx[k]++; s.flip = s.a > s.b; });

// 투영: 경도·위도 → 지도 좌표 (위도 방향 1.26배 보정)
var minLon = 1e9, maxLon = -1e9, minLat = 1e9, maxLat = -1e9;
STATIONS.forEach(function(s){ var c = C[s]; minLon = Math.min(minLon, c[1]); maxLon = Math.max(maxLon, c[1]); minLat = Math.min(minLat, c[0]); maxLat = Math.max(maxLat, c[0]); });
var PAD = 40, W = 1000, K = (W - PAD * 2) / (maxLon - minLon), H = Math.round((maxLat - minLat) * K * 1.26 + PAD * 2);
var P = {};
STATIONS.forEach(function(s){ var c = C[s]; P[s] = [PAD + (c[1] - minLon) * K, PAD + (maxLat - c[0]) * K * 1.26]; });
var BASE = {x:0, y:0, w:W, h:H};

function segName(s){ return s.a + '–' + s.b; }
function cssv(t){ return 'var(' + t + ')'; }
function lineBadge(lid){ var l = LINE_BY_ID[lid]; return '<span class="lb" style="background:' + l.color + '">' + l.name + '</span>'; }

/* ---------- 가상 데이터 생성 ---------- */
function hashStr(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

var ALARMS = {
  '5G':[
    {id:'A-0001', sev:'Critical', st:'혜화', eq:'RU-HH-03', at:'21:42'},
    {id:'A-0002', sev:'Critical', seg:'4:혜화-동대문', at:'21:40'},
    {id:'A-0003', sev:'Major', st:'동대문역사문화공원', eq:'DU-DDP-01', at:'20:15'},
    {id:'A-0006', sev:'Major', st:'강남', eq:'RU-GN-02', at:'20:55'},
    {id:'A-0005', sev:'Major', seg:'3:을지로3가-충무로', at:'18:30'},
    {id:'A-0004', sev:'Minor', st:'종로3가', eq:'RU-JR3-01', at:'19:05'}
  ],
  'LTE':[
    {id:'A-0101', sev:'Critical', st:'왕십리', eq:'DU-WSR-01', at:'21:10'},
    {id:'A-0105', sev:'Critical', st:'신림', eq:'RU-SLM-03', at:'21:25'},
    {id:'A-0102', sev:'Major', st:'서울역', eq:'RU-SEO-02', at:'20:48'},
    {id:'A-0104', sev:'Minor', st:'시청', eq:'RU-CHG-01', at:'16:05'},
    {id:'A-0103', sev:'Minor', seg:'2:을지로입구-을지로3가', at:'17:22'}
  ]
};
var SEV_RANK = {Critical:0, Major:1, Minor:2};
var SEV_TOK = {Critical:'--crit', Major:'--major', Minor:'--warn'};
var MISSING = {'5G':{'4:혜화-동대문':true}, 'LTE':{}};

var cache = {};
function getData(tech, period){
  var key = tech + period;
  if (cache[key]) return cache[key];
  var r = rng(hashStr(key));
  var pAdj = {'24h':0, '7d':-3, '30d':-5}[period], tAdj = tech === 'LTE' ? 4 : 0;
  var vScale = {'24h':16, '7d':84, '30d':310}[period] * (tech === 'LTE' ? 1.25 : 1);
  var st = {}, seg = {}, eq = [];
  STATIONS.forEach(function(id){
    var hot = HOT[id] != null ? HOT[id] : .22 + r() * .3;
    if (tech === 'LTE' && (id === '왕십리' || id === '신림')) hot += .2;
    var load = clamp(Math.round(40 + hot * 46 + (r() - .5) * 10 + pAdj + tAdj), 12, 99);
    var voc = Math.max(0, Math.round(hot * hot * vScale * (.7 + r() * .6)));
    var w = [r() + .6, r() + .4, r() * .6 + .2, r() * .4 + .1];
    if (tech === '5G' && id === '혜화') w[1] += 1.4;
    var sw = w.reduce(function(a, b){ return a + b; }, 0), types = w.map(function(x){ return Math.round(voc * x / sw); });
    types[3] = Math.max(0, voc - types[0] - types[1] - types[2]);
    var cd = CODE[id];
    var list = [
      {id:'RU-' + cd + '-01', loc:'대합실 B1', load:clamp(load - Math.round(4 + r() * 14), 5, 99)},
      {id:'RU-' + cd + '-02', loc:'승강장 B2', load:clamp(load - Math.round(1 + r() * 9), 5, 99)},
      {id:'RU-' + cd + '-03', loc:'승강장 B2', load:load},
      {id:'DU-' + cd + '-01', loc:'통신실', load:clamp(load - Math.round(10 + r() * 15), 5, 99)}
    ];
    list.forEach(function(e){ e.station = id; eq.push(e); });
    st[id] = {id:id, load:load, voc:voc, types:types, equip:list};
  });
  SEGS.forEach(function(s){
    var missing = !!MISSING[tech][s.id];
    var v = missing ? null : clamp(Math.round((st[s.a].load + st[s.b].load) / 2 + (r() - .5) * 18), 10, 99);
    seg[s.id] = {id:s.id, load:v, rep:s.rep, dist:(0.4 + r() * 0.8).toFixed(1)};
    eq.push({id:s.rep, loc:'터널 ' + segName(s), load:v, seg:s.id});
  });
  var alarms = ALARMS[tech].map(function(a){
    var o = Object.assign({}, a);
    if (a.seg){ var s = SEG_BY_ID[a.seg]; o.eq = s.rep; o.where = segName(s) + ' 터널'; o.focus = s.a; }
    else { o.where = a.st + (a.eq.indexOf('DU') === 0 ? ' 통신실' : ''); o.focus = a.st; }
    return o;
  }).sort(function(a, b){ return SEV_RANK[a.sev] - SEV_RANK[b.sev] || (a.at < b.at ? 1 : -1); });
  var eqSev = {};
  alarms.forEach(function(a){ if (!eqSev[a.eq] || SEV_RANK[a.sev] < SEV_RANK[eqSev[a.eq]]) eqSev[a.eq] = a.sev; });
  var d = {st:st, seg:seg, eq:eq, alarms:alarms, eqSev:eqSev};
  cache[key] = d; return d;
}
function stationAlarms(d, id){ return d.alarms.filter(function(a){ return a.st === id || (a.seg && (SEG_BY_ID[a.seg].a === id || SEG_BY_ID[a.seg].b === id)); }); }
function worstSev(list){ var w = null; list.forEach(function(a){ if (!w || SEV_RANK[a.sev] < SEV_RANK[w]) w = a.sev; }); return w; }
function series(id, peak, tech, period){
  var r = rng(hashStr(id + tech + period + 'h'));
  return PROFILE.map(function(p){ return clamp(Math.round(peak * p * (.93 + r() * .07)), 0, 100); });
}
function loadTok(v){ return v == null ? '--nodata' : v >= 85 ? '--crit' : v >= 70 ? '--warn' : '--ok'; }

/* ---------- 상태 ---------- */
var S = {tech:'5G', metric:'load', period:'24h', line:'all', sel:null, vb:Object.assign({}, BASE)};

function readHash(){
  var h = (location.hash || '').replace('#', '').split('-');
  if (h.length !== 3) return;
  var t = {'5g':'5G', 'lte':'LTE'}[h[0]];
  if (t) S.tech = t;
  if (METRIC_LABEL[h[1]]) S.metric = h[1];
  if (PERIOD_LABEL[h[2]]) S.period = h[2];
}
function writeHash(){
  var h = '#' + S.tech.toLowerCase() + '-' + S.metric + '-' + S.period;
  try { if (location.hash !== h) history.replaceState(null, '', h); } catch (e) {}
}

/* ---------- SVG 도우미 ---------- */
var NS = 'http://www.w3.org/2000/svg';
var svg = document.getElementById('map');
var box = document.getElementById('mapbox');
var pop = document.getElementById('pop');
svg.style.aspectRatio = W + ' / ' + H;
function el(tag, attrs, parent, style){
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (style) for (var s in style) e.style[s] = style[s];
  if (parent) parent.appendChild(e);
  return e;
}
function setVB(){ var v = S.vb; svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h); positionPop(); }

/* ---------- 렌더 ---------- */
function render(){
  var d = getData(S.tech, S.period);
  writeHash();
  renderControls();
  document.getElementById('headline').textContent = HEADLINE[S.metric];
  document.getElementById('eyebrow-sel').textContent = S.tech + ' · ' + METRIC_LABEL[S.metric] + ' · ' + PERIOD_LABEL[S.period];
  renderKpis(d);
  renderChips();
  renderMap(d);
  renderLegend();
  renderPop(d);
  renderDetail(d);
  renderPanels(d);
}

function renderControls(){
  [['ctl-tech', S.tech], ['ctl-metric', S.metric], ['ctl-period', S.period]].forEach(function(p){
    Array.prototype.forEach.call(document.getElementById(p[0]).children, function(b){ b.setAttribute('aria-pressed', String(b.dataset.v === p[1])); });
  });
}

function renderKpis(d){
  var voc = STATIONS.reduce(function(a, id){ return a + d.st[id].voc; }, 0);
  var hot = STATIONS.filter(function(id){ return d.st[id].load >= 85; }).length;
  var crit = d.alarms.filter(function(a){ return a.sev === 'Critical'; }).length;
  var ru = 0, du = 0, rep = 0;
  d.eq.forEach(function(e){ if (e.id.indexOf('RU') === 0) ru++; else if (e.id.indexOf('DU') === 0) du++; else rep++; });
  document.getElementById('kpis').innerHTML =
    kpi('VOC 건수', voc.toLocaleString('ko-KR') + '건', PERIOD_LABEL[S.period]) +
    kpi('부하율 85% 이상 역', hot + '개', '전체 ' + STATIONS.length + '개 역 중') +
    kpi('미해제 알람', d.alarms.length + '건', 'Critical ' + crit + '건', crit > 0) +
    kpi('관리 장비', (ru + du + rep).toLocaleString('ko-KR') + '대', 'RU ' + ru + ' · DU ' + du + ' · 중계기 ' + rep);
}
function kpi(k, v, s, crit){ return '<div class="kpi"><span class="k">' + k + '</span><span class="v num' + (crit ? ' crit' : '') + '">' + v + '</span><span class="s">' + s + '</span></div>'; }

function renderChips(){
  var items = [{id:'all', name:'전체'}].concat(LINES);
  document.getElementById('line-chips').innerHTML = items.map(function(l){
    return '<button type="button" class="chip" id="line-' + l.id + '" data-line="' + l.id + '" aria-pressed="' + (S.line === l.id) + '">' +
      (l.color ? '<span class="dot" style="background:' + l.color + '"></span>' : '') + l.name + '</button>';
  }).join('');
}

function lineOn(lid){ return S.line === 'all' || S.line === lid; }
function stationOn(id){ return S.line === 'all' || stationLines[id].indexOf(S.line) >= 0; }

function renderMap(d){
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  setVB();
  var k = S.vb.w / W, s = Math.pow(k, .78);           // 확대해도 화면상 크기가 과하게 커지지 않게
  var zoomed = k < .55;
  var gHalo = el('g', {fill:'none', 'stroke-linecap':'round'}, svg);
  var gSeg = el('g', {fill:'none', 'stroke-linecap':'round'}, svg);
  var gHit = el('g', {}, svg);
  var gMark = el('g', {}, svg);
  var gSt = el('g', {}, svg);
  var gLab = el('g', {}, svg);
  var maxVoc = Math.max.apply(null, STATIONS.map(function(id){ return d.st[id].voc; })) || 1;
  var lw = 3.4 * s;

  SEGS.forEach(function(sg){
    var a = P[sg.a], b = P[sg.b], on = lineOn(sg.line), v = d.seg[sg.id].load;
    var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = sg.par * lw * 1.15 * (sg.flip ? -1 : 1), nx = -dy / len * off, ny = dx / len * off;
    var at = {x1:a[0] + nx, y1:a[1] + ny, x2:b[0] + nx, y2:b[1] + ny};
    var col = LINE_BY_ID[sg.line].color;
    var selected = S.sel && S.sel.type === 'segment' && S.sel.id === sg.id;

    if (S.metric === 'load' && on && v != null && v >= 70){
      el('line', Object.assign({}, at, {'stroke-width':((4 + 16 * Math.sqrt(v / 100)) * s).toFixed(2)}), gHalo, {stroke:cssv(loadTok(v)), opacity:'.55'});
    }
    if (selected) el('line', Object.assign({}, at, {'stroke-width':(lw + 7 * s).toFixed(2)}), gHalo, {stroke:cssv('--ink')});
    var op = !on ? '.1' : S.metric === 'alarm' ? '.55' : '1';
    var la = Object.assign({}, at, {'stroke-width':lw.toFixed(2)});
    if (S.metric === 'load' && v == null && on){ la['stroke-dasharray'] = (2 * s) + ' ' + (5 * s); el('line', la, gSeg, {stroke:cssv('--nodata')}); }
    else el('line', la, gSeg, {stroke:col, opacity:op});

    if (on){
      var hit = el('line', Object.assign({}, at, {'stroke-width':(14 * s).toFixed(2), class:'seg-hit', 'data-seg':sg.id}), gHit, {stroke:'transparent'});
      el('title', {}, hit).textContent = LINE_BY_ID[sg.line].name + ' ' + segName(sg) + ' 터널 · 부하율 ' + (v == null ? '데이터 없음' : v + '%');
    }
    if (S.metric === 'alarm' && on){
      var al = d.alarms.filter(function(x){ return x.seg === sg.id; })[0];
      if (al){
        var mx = (at.x1 + at.x2) / 2, my = (at.y1 + at.y2) / 2, h = 8 * s;
        var gm = el('g', {'data-seg':sg.id, class:'seg-hit'}, gMark);
        if (al.sev === 'Critical') el('rect', {x:mx - h, y:my - h, width:h * 2, height:h * 2, rx:2 * s, class:'pulse'}, gm, {fill:cssv(SEV_TOK[al.sev])});
        el('rect', {x:mx - h, y:my - h, width:h * 2, height:h * 2, rx:2 * s}, gm, {fill:cssv(SEV_TOK[al.sev]), stroke:cssv('--surface'), strokeWidth:String(1.5 * s)});
        el('text', {x:mx, y:my + 4 * s, 'text-anchor':'middle', 'font-size':(11 * s).toFixed(2), 'font-weight':'700'}, gm, {fill:'#FFFFFF'}).textContent = 'T';
      }
    }
  });

  // 지표별로 이름을 꼭 보여줄 역 (확대 전)
  var must = {};
  STATIONS.forEach(function(id){ if (stationLines[id].length >= 3) must[id] = 1; });
  if (S.metric === 'load') STATIONS.slice().sort(function(a, b){ return d.st[b].load - d.st[a].load; }).slice(0, 6).forEach(function(id){ must[id] = 1; });
  if (S.metric === 'voc') STATIONS.slice().sort(function(a, b){ return d.st[b].voc - d.st[a].voc; }).slice(0, 6).forEach(function(id){ must[id] = 1; });
  if (S.metric === 'alarm') d.alarms.forEach(function(a){ must[a.focus] = 1; if (a.seg) must[SEG_BY_ID[a.seg].b] = 1; });
  if (S.sel && S.sel.type === 'station') must[S.sel.id] = 1;

  STATIONS.forEach(function(id){
    var p = P[id], on = stationOn(id), sd = d.st[id], transfer = stationLines[id].length > 1;

    if (S.metric === 'load'){
      var hotSt = sd.load >= 70;
      el('circle', {cx:p[0], cy:p[1], r: hotSt ? r0 * 1.25 : r0, class:'st-core'}, g, {fill: hotSt ? cssv(loadTok(sd.load)) : cssv('--surface'), stroke: hotSt ? cssv('--surface') : cssv('--ink'), strokeWidth:String((hotSt ? 1.4 : 1.3) * s)});
      label += sd.load + '%';

      el('circle', {cx:p[0], cy:p[1], r:rv, class:'st-core'}, g, {fill:cssv('--accent'), fillOpacity:'.25', stroke:cssv('--accent'), strokeWidth:String(1.3 * s)});
      if (rv >= 11 * s && (zoomed || sd.voc / maxVoc > .45)) el('text', {x:p[0], y:p[1] + 3.6 * s, 'text-anchor':'middle', 'font-size':(10 * s).toFixed(2), 'font-weight':'700'}, g, {fill:cssv('--ink')}).textContent = sd.voc;
      label += sd.voc + '건';
    } else {
      var w = worstSev(d.alarms.filter(function(a){ return a.st === id; }));
      if (w === 'Critical') el('circle', {cx:p[0], cy:p[1], r:9 * s, class:'pulse'}, g, {fill:cssv('--crit')});
      el('circle', {cx:p[0], cy:p[1], r: w ? 7 * s : r0, class:'st-core'}, g, {fill: w ? cssv(SEV_TOK[w]) : cssv('--surface'), stroke: w ? cssv('--surface') : cssv('--ink-2'), strokeWidth:String(1.3 * s)});
      label += w ? w + ' 알람' : '알람 없음';
    }
    el('circle', {cx:p[0], cy:p[1], r:Math.max(9 * s, r0 + 4 * s)}, g, {fill:'transparent'});
    g.setAttribute('aria-label', label);

    if (on && (zoomed || must[id])){
      var t = el('text', {x:p[0] + 7 * s, y:p[1] - 6 * s, 'font-size':(11 * s).toFixed(2), 'font-weight': (transfer || selected || must[id]) ? '700' : '400', 'paint-order':'stroke', 'stroke-width':(3.2 * s).toFixed(2), 'stroke-linejoin':'round'}, gLab, {fill:cssv(transfer || must[id] ? '--ink' : '--ink-2'), stroke:cssv('--surface')});
      t.textContent = id;
    }
  });
}

function positionPop(){
  if (pop.hidden || !S.sel || S.sel.type !== 'station') return;

  var pt = svg.createSVGPoint(); pt.x = P[S.sel.id][0]; pt.y = P[S.sel.id][1];
  var sp = pt.matrixTransform(m), br = box.getBoundingClientRect();
  var x = sp.x - br.left, y = sp.y - br.top;
  if (x < 0 || y < 0 || x > br.width || y > br.height){ pop.style.visibility = 'hidden'; return; }
  pop.style.visibility = 'visible';
  var pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 14;
  var left = x + gap; if (left + pw > br.width - 8) left = x - gap - pw; if (left < 8) left = Math.max(8, Math.min(br.width - pw - 8, x - pw / 2));
  var top = y - ph / 2; top = Math.max(8, Math.min(br.height - ph - 8, top));
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}

function loadChart(d, t){
  var name, peak, kind;
  if (t.type === 'station'){ name = t.id; peak = d.st[t.id].load; kind = '역사'; }
  else { name = segName(SEG_BY_ID[t.id]); peak = d.seg[t.id].load; kind = '터널'; }
  if (peak == null) return '<h2>시간대별 부하율 · ' + name + '</h2><p class="note">이 구간은 측정값이 없습니다. 중계기 상태를 확인하세요.</p>';
  var v = series(t.id, peak, S.tech, S.period);
  var CW = 380, CH = 190, x0 = 34, y0 = 14, w = CW - x0 - 10, h = CH - y0 - 30;
  var X = function(i){ return x0 + i * w / 23; }, Y = function(p){ return y0 + h - p / 100 * h; };
  var pts = v.map(function(p, i){ return X(i).toFixed(1) + ',' + Y(p).toFixed(1); }).join(' ');
  var area = 'M' + X(0) + ',' + Y(0) + ' L' + pts.split(' ').join(' L') + ' L' + X(23) + ',' + Y(0) + ' Z';
  var pi = v.indexOf(Math.max.apply(null, v));
  var g = '';
  [0, 50, 100].forEach(function(p){ g += '<line x1="' + x0 + '" x2="' + (x0 + w) + '" y1="' + Y(p) + '" y2="' + Y(p) + '" style="stroke:var(--rule)"/><text x="' + (x0 - 6) + '" y="' + (Y(p) + 4) + '" text-anchor="end" font-size="10" style="fill:var(--ink-2)">' + p + '</text>'; });
  g += '<line x1="' + x0 + '" x2="' + (x0 + w) + '" y1="' + Y(85) + '" y2="' + Y(85) + '" stroke-dasharray="4 4" stroke-width="1.5" style="stroke:var(--crit)"/><text x="' + (x0 + w) + '" y="' + (Y(85) - 5) + '" text-anchor="end" font-size="10" style="fill:var(--crit)">85% 위험</text>';
  g += '<line x1="' + x0 + '" x2="' + (x0 + w) + '" y1="' + Y(70) + '" y2="' + Y(70) + '" stroke-dasharray="2 4" style="stroke:var(--warn)"/>';
  g += '<path d="' + area + '" style="fill:var(--ink);fill-opacity:.07"/><polyline points="' + pts + '" fill="none" stroke-width="2.2" stroke-linejoin="round" style="stroke:var(--ink)"/>';
  g += '<circle cx="' + X(pi) + '" cy="' + Y(v[pi]) + '" r="4" style="fill:' + cssv(loadTok(v[pi])) + ';stroke:var(--surface)" stroke-width="2"/><text x="' + Math.min(X(pi), x0 + w - 60) + '" y="' + (Y(v[pi]) - 9) + '" font-size="11" font-weight="700" style="fill:var(--ink)">' + pi + '시 ' + v[pi] + '%</text>';
  [0, 6, 12, 18, 23].forEach(function(i){ g += '<text x="' + X(i) + '" y="' + (CH - 8) + '" text-anchor="middle" font-size="10" style="fill:var(--ink-2)">' + String(i).padStart(2, '0') + '시</text>'; });
  return '<h2>시간대별 부하율 · ' + name + ' <span style="font-weight:400;color:var(--ink-2);font-size:13px">' + kind + (S.period === '24h' ? '' : ' · ' + PERIOD_LABEL[S.period] + ' 시간대 평균') + '</span></h2>' +
    '<div class="tbl"><svg class="chart" viewBox="0 0 ' + CW + ' ' + CH + '" style="width:100%;height:auto;display:block;min-width:300px" role="img" aria-label="' + name + ' 시간대별 부하율, 최고 ' + pi + '시 ' + v[pi] + '%">' + g + '</svg></div>';

/* ---------- 지도 이동·확대 ---------- */
function focusOn(id, w){
  var p = P[id]; w = w || Math.min(S.vb.w, 420); var h = w * H / W;
  S.vb = {x:p[0] - w / 2, y:p[1] - h / 2, w:w, h:h};
}
var zoomRaf = 0;
function zoom(f, cx, cy){
  var v = S.vb, nw = clamp(v.w * f, 140, W * 1.2), nh = nw * H / W;
  if (cx == null){ cx = v.x + v.w / 2; cy = v.y + v.h / 2; }
  var rx = (cx - v.x) / v.w, ry = (cy - v.y) / v.h;
  S.vb = {x:cx - rx * nw, y:cy - ry * nh, w:nw, h:nh};
  setVB();
  if (!zoomRaf) zoomRaf = requestAnimationFrame(function(){ zoomRaf = 0; renderMap(getData(S.tech, S.period)); positionPop(); });
}

/* ---------- 이벤트 ---------- */
function bindSeg(id, key){
  document.getElementById(id).addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    S[key] = b.dataset.v; if (key === 'metric' && S.sel && S.sel.alarm) S.sel = null; render();
  });
}
bindSeg('ctl-tech', 'tech'); bindSeg('ctl-metric', 'metric'); bindSeg('ctl-period', 'period');

document.getElementById('line-chips').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return; S.line = b.dataset.line; render();
});
document.getElementById('zoom-in').addEventListener('click', function(){ zoom(.7); });
document.getElementById('zoom-out').addEventListener('click', function(){ zoom(1 / .7); });
document.getElementById('zoom-reset').addEventListener('click', function(){ S.vb = Object.assign({}, BASE); render(); });

function pick(type, id, opts){
  S.sel = {type:type, id:id};
  if (opts && opts.alarm) S.sel.alarm = opts.alarm;
  if (opts && opts.focus) focusOn(opts.focus);
  render();
}
document.getElementById('aside').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'detail-close'){ S.sel = null; render(); return; }
  if (b.id === 'to-station'){ b.textContent = '역 상세 화면(⑤)은 다음 단계에서 연결됩니다'; return; }
  if (b.dataset.pick){ var p = b.dataset.pick.split('|'); pick(p[0], p[1], {focus: p[0] === 'station' ? p[1] : SEG_BY_ID[p[1]].a}); return; }
  if (b.dataset.alarm){
    var a = getData(S.tech, S.period).alarms.filter(function(x){ return x.id === b.dataset.alarm; })[0];
    if (a.seg) pick('segment', a.seg, {alarm:a.id, focus:a.focus}); else pick('station', a.st, {alarm:a.id, focus:a.focus});
  }
});

// 드래그 이동과 클릭 구분
var drag = null, justDragged = false;
function svgPt(e){ var r = svg.getBoundingClientRect(); return [S.vb.x + (e.clientX - r.left) / r.width * S.vb.w, S.vb.y + (e.clientY - r.top) / r.height * S.vb.h]; }
svg.addEventListener('pointerdown', function(e){ if (e.button !== 0) return; drag = {sx:e.clientX, sy:e.clientY, vb:Object.assign({}, S.vb), moved:false, id:e.pointerId}; justDragged = false; });
svg.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 5){ drag.moved = true; svg.classList.add('dragging'); try { svg.setPointerCapture(drag.id); } catch (er) {} }
  if (drag.moved){ var r = svg.getBoundingClientRect(); S.vb.x = drag.vb.x - dx / r.width * drag.vb.w; S.vb.y = drag.vb.y - dy / r.height * drag.vb.h; setVB(); }
});
function endDrag(){ if (!drag) return; justDragged = drag.moved; drag = null; svg.classList.remove('dragging'); }
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('click', function(e){
  if (justDragged){ justDragged = false; return; }
  var st = e.target.closest && e.target.closest('[data-st]');
  var sg = e.target.closest && e.target.closest('[data-seg]');
  if (st) pick('station', st.getAttribute('data-st'));
  else if (sg) pick('segment', sg.getAttribute('data-seg'));
  else if (S.sel){ S.sel = null; render(); }
});
svg.addEventListener('wheel', function(e){
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); var p = svgPt(e); zoom(e.deltaY > 0 ? 1.12 : 1 / 1.12, p[0], p[1]);
}, {passive:false});
svg.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var st = e.target.closest && e.target.closest('[data-st]');
  if (st){ e.preventDefault(); var id = st.getAttribute('data-st'); pick('station', id); var n = svg.querySelector('[data-st="' + id + '"]'); if (n) n.focus(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && S.sel){ S.sel = null; render(); } });
window.addEventListener('resize', positionPop);
window.addEventListener('hashchange', function(){ readHash(); render(); });

readHash();
render();
})();
</script>
</body>
</html>
